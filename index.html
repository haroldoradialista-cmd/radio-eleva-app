<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Eleva</title>
<!-- Leva direto para o painel. Antes existia aqui uma COPIA ANTIGA do
     painel, que ficava desatualizada e podia confundir. Agora a raiz
     apenas encaminha para a versao oficial, em /painel/. -->
<link rel="canonical" href="/painel/">
<meta http-equiv="refresh" content="0; url=/painel/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;
       justify-content:center;text-align:center;
       font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
       background:linear-gradient(180deg,#0A2140,#071A33 40%,#041020);
       color:#E8EEF6}
  .caixa{padding:24px}
  img{width:88px;height:88px;border-radius:18px;margin-bottom:16px}
  h1{font-size:19px;margin:0 0 6px;color:#fff}
  p{font-size:13.5px;color:#BDB8F0;margin:0 0 18px}
  a{display:inline-block;padding:12px 22px;border-radius:24px;
    background:linear-gradient(135deg,#35C733,#1E9BFF);color:#fff;
    text-decoration:none;font-weight:700;font-size:14px}
  .carregando{margin-top:14px;font-size:12px;color:#8a92c0}
</style>
</head>
<body>
  <div class="caixa">
    <img src="assets/logo.png" alt="" onerror="this.style.display='none'">
    <h1>Painel Eleva</h1>
    <p>Abrindo o gerenciador...</p>
    <a href="/painel/">Entrar no painel</a>
    <div class="carregando">Se não abrir sozinho, toque no botão acima.</div>
  </div>
  <script>location.replace('/painel/');</script>
</body>
</html>
