name: Compilar APK da Radio Eleva

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'config.json'
      - 'imagens/**'
      - 'README.md'
      - 'painel/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configurar chave de assinatura
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.CHAVE_ASSINATURA }}" | base64 -d > ~/.android/debug.keystore

      - name: Conferir chave de assinatura
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" \
          || (echo "::error::PROBLEMA! O secret CHAVE_ASSINATURA esta ausente ou invalido. Confira em Settings > Secrets and variables > Actions." && exit 1)

      - name: Preparar projeto Android
        run: bash setup_android.sh

      - name: Baixar dependencias
        run: flutter pub get

      - name: Gerar icone do app
        run: dart run flutter_launcher_icons

      - name: Compilar APK
        run: flutter build apk --release

      - name: Conferir assinatura do APK gerado
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA1:|SHA256:" \
          || echo "AVISO: nao foi possivel ler a assinatura do APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-eleva-apk
          path: build/app/outputs/flutter-apk/app-release.apk
