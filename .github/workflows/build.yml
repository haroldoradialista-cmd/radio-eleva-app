name: Compilar APK da Radio Eleva

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'config.json'
      - 'imagens/**'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar projeto Android
        run: bash setup_android.sh

      - name: Baixar dependencias
        run: flutter pub get

      - name: Gerar icone do app
        run: dart run flutter_launcher_icons

      - name: Compilar APK
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-eleva-apk
          path: build/app/outputs/flutter-apk/app-release.apk
